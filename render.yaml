# Render Blueprint — lets Render create the backend service from repo config
# instead of clicking through the dashboard by hand.
# Usage: Render dashboard -> New -> Blueprint -> select this repo.
# Vars marked sync: false are secrets/per-deploy values filled in via the
# Render dashboard after the blueprint is created (or on an existing service's
# Environment tab if it already exists — editing this file doesn't retroactively
# update a running service).
#
# Storage: STORAGE_BACKEND selects LocalDiskStorage ("local", default) or
# S3StorageBackend ("s3"). Render's free plan has no persistent disk, so
# uploaded/processed images under "local" are lost whenever the instance
# restarts (idle spin-down, redeploy). Use "s3" with a Cloudflare R2 bucket
# (or any S3-compatible store) for images that need to survive that.
services:
  - type: web
    name: mri-image-processing-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
